<!doctype html>
<meta charset="utf-8">
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:14px;background:#0d0d0f;color:#e9e5e3}
  h2{margin:0 0 10px;font-size:15px;color:#e3b4b1}
  input{width:100%;background:#1b1a1d;border:1px solid #2e2a2c;color:#e9e5e3;border-radius:6px;padding:8px;font:14px monospace;margin-bottom:8px}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  button{background:#272225;color:#e9e5e3;border:1px solid #2e2a2c;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
  button.active{background:#b23b36;border-color:#b23b36;color:#fff}
  button.run{background:#b23b36;border-color:#b23b36;color:#fff;font-size:13px;padding:8px 14px}
  pre{background:#0a0a0b;border-radius:6px;padding:10px;height:220px;overflow:auto;white-space:pre-wrap;font-size:12px;margin-top:10px}
  .muted{color:#948b89;font-size:12px}
</style>
<h2>Nmap Scan</h2>
<input id="target" placeholder="Target (IP, host, or CIDR) — e.g. scanme.nmap.org">
<div class="presets">
  <button data-flags="-T4 -F" class="preset">Quick</button>
  <button data-flags="-sV -T4" class="preset active">Service/Version</button>
  <button data-flags="-p- -T4" class="preset">All ports</button>
  <button data-flags="-sS -T4 -Pn" class="preset">Stealth SYN</button>
  <button data-flags="-O -T4" class="preset">OS detect</button>
</div>
<p class="muted">Flags: <span id="flagsLabel">-sV -T4</span></p>
<button class="run" id="go">Scan</button>
<pre id="result">Results will appear here. Only scan systems you own or have written permission to test.</pre>
<script>
  var flags = "-sV -T4";
  var target = document.getElementById('target');
  var label = document.getElementById('flagsLabel');
  var result = document.getElementById('result');

  document.querySelectorAll('.preset').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.preset').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      flags = b.dataset.flags;
      label.textContent = flags;
      sendArgs();
    };
  });
  target.oninput = sendArgs;

  function sendArgs() {
    parent.postMessage({ type: 'setArgs', args: { flags: flags, target: target.value } }, '*');
  }

  document.getElementById('go').onclick = function () {
    result.textContent = 'Scanning ' + target.value + ' ...';
    parent.postMessage({ type: 'run', args: { flags: flags, target: target.value } }, '*');
  };

  window.addEventListener('message', function (e) {
    var msg = e.data || {};
    if (msg.type === 'init') {
      if (msg.data && msg.data.lastTarget) target.value = msg.data.lastTarget;
      else if (msg.values && msg.values.target) target.value = msg.values.target;
    }
    if (msg.type === 'result') {
      var r = msg.result;
      result.textContent = (r.stdout || '') + (r.stderr ? ('\n' + r.stderr) : '');
      parent.postMessage({ type: 'saveData', data: { lastTarget: target.value, lastFlags: flags } }, '*');
    }
  });
</script>
